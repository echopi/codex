name: Build and release cdx

on:
  push:
    tags:
      - 'cdx-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add target to pinned toolchain
        run: rustup target add ${{ matrix.target }}
        working-directory: codex-rs

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build release binary
        run: cargo build --release --bin cdx --target ${{ matrix.target }}
        working-directory: codex-rs

      - name: Package binary
        run: |
          BINARY=codex-rs/target/${{ matrix.target }}/release/cdx
          ARCHIVE=cdx-${{ matrix.target }}
          cp "$BINARY" "$ARCHIVE"
          chmod +x "$ARCHIVE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdx-${{ matrix.target }}
          path: cdx-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/cdx-x86_64-apple-darwin/cdx-x86_64-apple-darwin
            artifacts/cdx-aarch64-apple-darwin/cdx-aarch64-apple-darwin
            artifacts/cdx-x86_64-unknown-linux-gnu/cdx-x86_64-unknown-linux-gnu
          generate_release_notes: true
